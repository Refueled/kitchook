services:
  kitchook-deploy-runner:
    # GitHub's official runner image, version tag plus immutable multi-platform
    # OCI index digest. See README.md for provenance and the upgrade procedure.
    image: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    working_dir: /runner
    entrypoint:
      - /opt/kitchook/runner/entrypoint.sh

    environment:
      HOME: /tmp/home
      RUNNER_REPOSITORY_URL: https://github.com/OWNER/REPOSITORY # REPLACE.
      RUNNER_NAME: kitchook-deploy-truenas # REPLACE if this name is already registered.
      RUNNER_LABELS: kitchook-deploy
      RUNNER_REGISTRATION_TOKEN: REPLACE_ONE_TIME_TOKEN # REMOVE this entire line after first registration.
      ACTIONS_RUNNER_HOOK_JOB_COMPLETED: /opt/kitchook/runner/job-completed.sh
      KITCHOOK_SITE_ROOT: /srv/site
      KITCHOOK_ORIGIN_URL: http://TRUENAS_LAN_IP:HOST_PORT # REPLACE; use the direct LAN Caddy origin.
      KITCHOOK_RETAIN_RELEASES: "5"

    volumes:
      - type: bind
        source: /mnt/POOL/apps/kitchook-runner-state # REPLACE; dedicated persistent state owned by 1001:1001.
        target: /runner
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/POOL/apps/kitchook-operations # REPLACE; installed deployment scripts only.
        target: /opt/kitchook
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/POOL/apps/kitchook/site # REPLACE; the same site directory Caddy mounts read-only.
        target: /srv/site
        bind:
          create_host_path: false

    # Workspaces, downloaded actions/artifacts, and job temp data do not persist.
    tmpfs:
      - /runner/_work:rw,nosuid,nodev,exec,size=512m,mode=0700,uid=1001,gid=1001
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777,uid=1001,gid=1001

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # No port, host network, privileged mode, or Docker socket is present.
    healthcheck:
      test: ["CMD-SHELL", "test -s /runner/.runner && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    cpus: "1.00"
    mem_limit: 1g
    pids_limit: 200
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
