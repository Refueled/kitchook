name: Deploy kitchook.com

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/deploy-cli/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchook-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: website-production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            .github/deploy-cli/package-lock.json

      - name: Install locked website dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Check and build website
        working-directory: website
        run: |
          npm run check
          npm run build

      # The deployment CLI is installed from its own lockfile, outside the
      # application dependency tree, so the wrangler that receives Cloudflare
      # credentials is never the same wrangler dependabot updates in /website.
      - name: Install pinned deployment CLI
        working-directory: .github/deploy-cli
        run: npm ci --ignore-scripts

      - name: Deploy completed static artifact
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          .github/deploy-cli/node_modules/.bin/wrangler pages deploy website/dist
          --project-name=kitchook-com
          --branch=main
