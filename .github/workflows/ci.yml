name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded pull-request validation is disposable. Main pushes use a unique
# group so a newer push cannot cancel a release-verification build.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build production site
        env:
          PUBLIC_DEPLOYMENT_ID: ${{ github.sha }}
        run: npm run build

      - name: Verify deployable site entry point
        run: test -f dist/index.html

      - name: Build builder image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="${{ github.sha }}" \
            -t kitchook-builder:ci .

      - name: Verify builder success and failed-build output safety
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kitchook-builder-output"
          sudo install -d -o 1000 -g 1000 "$output"
          sudo touch "$output/preexisting-artifact"
          sudo chown 1000:1000 "$output/preexisting-artifact"

          if docker run --rm \
            -v "$PWD/tests/fixtures/malformed-cookbook:/input:ro" \
            -v "$output:/output:rw" \
            kitchook-builder:ci; then
            echo "Malformed cookbook unexpectedly built." >&2
            exit 1
          fi
          test -f "$output/preexisting-artifact"

          docker run --rm \
            -v "$PWD/tests/fixtures/alternate-cookbook:/input:ro" \
            -v "$output:/output:rw" \
            kitchook-builder:ci
          test -f "$output/index.html"
          test -f "$output/recipes/lemon-rice/index.html"
          test -f "$output/search/index.json"
          test -f "$output/api/recipes.json"
          test -d "$output/_astro"
          test ! -e "$output/preexisting-artifact"

      - name: Upload deployable site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 14

  website:
    name: Check and build website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked website dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Check production website
        working-directory: website
        run: |
          npm run check
          npm run build
