name: Publish packages

# Publishes the @kitchook workspace packages to the public npm registry using
# OIDC trusted publishing. There is deliberately no NPM_TOKEN: the npm CLI
# exchanges a short-lived GitHub OIDC token for a scoped publish credential, and
# provenance attestations are generated automatically.
#
# This workflow filename must match the "Workflow filename" configured for each
# package's trusted publisher on npmjs.com. The publish step lives here rather
# than in a reusable workflow because trusted publishing validates the workflow
# that contains the publish command. See docs/packages.md.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and validate only; do not publish.
        type: boolean
        default: true

permissions:
  contents: read
  # Required so the runner can mint the OIDC token npm exchanges for a
  # short-lived publish credential.
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @kitchook packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Caching is intentionally omitted: release builds must not restore a
      # dependency tree that a cache could have influenced.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Verify npm and Node support trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const { execSync } = require('node:child_process');
            const parse = (value) => value.replace(/^v/, '').split('.').map(Number);
            const atLeast = (have, need) =>
              have[0] > need[0] ||
              (have[0] === need[0] && (have[1] > need[1] ||
                (have[1] === need[1] && have[2] >= need[2])));
            const nodeVersion = parse(process.versions.node);
            const npmVersion = parse(execSync('npm -v').toString().trim());
            if (!atLeast(nodeVersion, [22, 14, 0])) {
              console.error('Node ' + process.versions.node + ' is too old; trusted publishing requires >= 22.14.0.');
              process.exit(1);
            }
            if (!atLeast(npmVersion, [11, 5, 1])) {
              console.error('npm ' + npmVersion.join('.') + ' is too old; trusted publishing requires >= 11.5.1.');
              process.exit(1);
            }
            console.log('Node ' + process.versions.node + ' with npm ' + npmVersion.join('.') + ' supports trusted publishing.');
          "

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Package changed workspace packages
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ "$DRY_RUN" != "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing to publish from ${GITHUB_REF}; publish from main." >&2
            exit 1
          fi

          processed=0
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")

            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then
              echo "skip (private): ${name}"
              continue
            fi

            # Re-running is safe: a version that is already on the registry is
            # never republished, and npm rejects duplicate versions anyway.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip (already published): ${name}@${version}"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry run: ${name}@${version}"
              npm publish --workspace "${name}" --ignore-scripts --dry-run
            else
              echo "publishing: ${name}@${version}"
              npm publish --workspace "${name}" --ignore-scripts
            fi

            processed=$((processed + 1))
          done

          echo "Processed ${processed} package(s)."
