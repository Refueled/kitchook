name: Deploy demo.kitchook.com

on:
  push:
    branches:
      - main
    paths:
      - 'astro.config.mjs'
      - 'instance.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'recipes/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchook-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy public demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo-production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install locked builder dependencies
        run: npm ci --ignore-scripts

      - name: Test and build public examples
        env:
          PUBLIC_DEPLOYMENT_ID: ${{ github.sha }}
        run: |
          npm test
          npm run build

      - name: Install locked deployment CLI
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Deploy completed static artifact
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          website/node_modules/.bin/wrangler pages deploy dist
          --project-name=demo-kitchook-com
          --branch=main
