name: Bug report
description: Report reproducible incorrect behavior in KitchooK!
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For suspected vulnerabilities, stop here and use GitHub Private Vulnerability Reporting as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: KitchooK! version
      description: Include the source version or OCI tag and digest.
      placeholder: 0.1.4 / sha256:…
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Build interface
      options:
        - Source checkout
        - OCI builder
        - Generated static site
        - Documentation website
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and sanitized sample content. Do not include private recipes or credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Node/npm or container runtime versions, and static host where relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized text; remove secrets and personal information.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets, private recipes, or sensitive infrastructure details.
          required: true
