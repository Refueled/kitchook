name: Feature request
description: Propose a focused improvement to KitchooK!
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution and how it preserves the static-first architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contract
    attributes:
      label: Does this change a documented contract?
      options:
        - No
        - Recipe input or schema
        - Instance configuration
        - Static output or JSON API
        - OCI builder interface
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I have not included private recipes, credentials, or sensitive infrastructure details.
          required: true
